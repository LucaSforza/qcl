[package]
name = "safeops-k8s"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Local Kubernetes SafeOps showcase built on QCL"
publish = false

[dependencies]
qcl = { path = "../.." }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
