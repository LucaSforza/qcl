apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeops-demo
  namespace: safeops-demo
  labels:
    app.kubernetes.io/name: safeops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: safeops-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safeops-demo
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: safeops-demo
  namespace: safeops-demo
spec:
  selector:
    app.kubernetes.io/name: safeops-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
