apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeops-demo
  namespace: safeops-demo
  labels:
    app.kubernetes.io/name: safeops-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: safeops-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safeops-demo
    spec:
      containers:
        - name: app
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: safeops-demo
  namespace: safeops-demo
spec:
  selector:
    app.kubernetes.io/name: safeops-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
