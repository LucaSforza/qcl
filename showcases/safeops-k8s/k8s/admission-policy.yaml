apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: safeops-minimum-replicas
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "replicasets"]
  validations:
    - expression: "has(object.spec.replicas) && object.spec.replicas >= 2"
      message: "SafeOps workloads must run at least two replicas"
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: safeops-minimum-replicas
spec:
  policyName: safeops-minimum-replicas
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        safeops.qcl.io/enforced: "true"
